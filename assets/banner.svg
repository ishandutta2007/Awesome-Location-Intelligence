<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="40%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#071a2e" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="gridFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.4; }
    .pulse-circle { animation: pulse 4s infinite cubic-bezier(0.4, 0, 0.6, 1); transform-origin: 980px 190px; }
    .pulse-circle-delayed { animation: pulse 4s infinite cubic-bezier(0.4, 0, 0.6, 1) 2s; transform-origin: 980px 190px; }
    .radar-sweep { animation: rotate 10s linear infinite; transform-origin: 980px 190px; }
    .float-node-1 { animation: float 6s ease-in-out infinite alternate; }
    .float-node-2 { animation: float 7s ease-in-out infinite alternate-reverse; }
    .shimmer-text { background: linear-gradient(90deg, #ffffff, #a5f3fc, #c4b5fd, #ffffff); -webkit-background-clip: text; }
    
    @keyframes pulse {
      0% { r: 15px; opacity: 0.8; stroke-width: 2px; }
      50% { opacity: 0.4; }
      100% { r: 140px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes float {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(-8px) translateX(5px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dash 5s linear infinite;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="380" fill="url(#bgGradient)" rx="16" />

  <!-- Hexagonal & Coordinate Perspective Grid (Background) -->
  <g opacity="0.35">
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="0" y1="350" x2="1200" y2="350" class="grid-line" />

    <line x1="150" y1="0" x2="150" y2="380" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="380" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="380" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="380" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="380" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="380" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="380" class="grid-line" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="180" fill="url(#radarGlow)" filter="url(#glow)" opacity="0.4" />
  <circle cx="980" cy="190" r="160" fill="url(#radarGlow)" filter="url(#glow)" opacity="0.6" />

  <!-- DYNAMIC ELEMENT 1: Geospatial Radar & Orbital Coordinates at right -->
  <g id="dynamic-radar" transform="translate(0, 0)">
    <!-- Radar concentric rings -->
    <circle cx="980" cy="190" r="40" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.5" />
    <circle cx="980" cy="190" r="80" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.4" />
    <circle cx="980" cy="190" r="120" fill="none" stroke="#0369a1" stroke-width="1" opacity="0.3" />
    <circle cx="980" cy="190" r="155" fill="none" stroke="#0369a1" stroke-width="0.8" opacity="0.2" />

    <!-- Animated Pulsing Radar Waves -->
    <circle cx="980" cy="190" r="20" fill="none" stroke="#38bdf8" class="pulse-circle" />
    <circle cx="980" cy="190" r="20" fill="none" stroke="#818cf8" class="pulse-circle-delayed" />

    <!-- Rotating Radar Sweep Wedge -->
    <g class="radar-sweep">
      <path d="M 980 190 L 1120 140 A 155 155 0 0 0 980 35 Z" fill="url(#radarGlow)" opacity="0.5" />
      <line x1="980" y1="190" x2="1120" y2="140" stroke="#38bdf8" stroke-width="2" filter="url(#softGlow)" />
    </g>

    <!-- Radar Crosshairs -->
    <line x1="820" y1="190" x2="1140" y2="190" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="4 4" opacity="0.3" />
    <line x1="980" y1="30" x2="980" y2="350" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="4 4" opacity="0.3" />
  </g>

  <!-- DYNAMIC ELEMENT 2: Animated Geospatial Network Nodes & Connecting Flows -->
  <g id="geospatial-network">
    <!-- Connecting flow lines -->
    <path d="M 850 120 Q 910 160 980 190" fill="none" stroke="#38bdf8" stroke-width="1.5" class="flow-line" opacity="0.7" />
    <path d="M 980 190 Q 1040 230 1100 160" fill="none" stroke="#818cf8" stroke-width="1.5" class="flow-line" opacity="0.7" />
    <path d="M 980 190 Q 940 260 900 280" fill="none" stroke="#00f2fe" stroke-width="1.5" class="flow-line" opacity="0.7" />

    <!-- Floating Hotspot Nodes -->
    <g class="float-node-1">
      <circle cx="850" cy="120" r="5" fill="#38bdf8" filter="url(#softGlow)" />
      <circle cx="850" cy="120" r="10" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6">
        <animate attributeName="r" values="8;16;8" dur="3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite" />
      </circle>
      <text x="862" y="124" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">POI Cluster [37.77, -122.41]</text>
    </g>

    <g class="float-node-2">
      <circle cx="1100" cy="160" r="5" fill="#818cf8" filter="url(#softGlow)" />
      <circle cx="1100" cy="160" r="12" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.6">
        <animate attributeName="r" values="6;18;6" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.7;0.1;0.7" dur="4s" repeatCount="indefinite" />
      </circle>
      <text x="1010" y="145" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Foot-Traffic Matrix</text>
    </g>

    <g class="float-node-1">
      <circle cx="900" cy="280" r="4.5" fill="#00f2fe" filter="url(#softGlow)" />
      <text x="912" y="284" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Spatial Index H3</text>
    </g>

    <!-- Center Radar Target Pin -->
    <circle cx="980" cy="190" r="7" fill="#ffffff" filter="url(#glow)" />
    <circle cx="980" cy="190" r="3.5" fill="#0284c7" />
  </g>

  <!-- FOREGROUND: Header Badge, Title, Subtitle, & Tech Tags (Guaranteed High Contrast & In Front) -->
  <g id="foreground-content" transform="translate(60, 0)">
    
    <!-- Top Category Pill / Badge -->
    <g transform="translate(0, 52)">
      <rect width="210" height="28" rx="14" fill="#0369a1" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="14" cy="14" r="5" fill="#00f2fe">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="18" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Location Intelligence
    </text>

    <!-- Gradient Accent Sub-Headline Under Title -->
    <text x="0" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700" fill="url(#primaryGlow)" letter-spacing="0.2">
      Spatial Analytics • GIS Engines • Foot Traffic • Geocoding
    </text>

    <!-- Explanatory Subtitle -->
    <text x="0" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
      A directory of leading enterprise SaaS platforms and high-performance open-source libraries
    </text>
    <text x="0" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
      empowering modern geographic data science, market planning, and mobility intelligence.
    </text>

    <!-- Feature Tag Badges at Bottom of Banner -->
    <g transform="translate(0, 275)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="136" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🌐 Cloud-Native GIS</text>
      </g>

      <!-- Tag 2 -->
      <g transform="translate(146, 0)">
        <rect width="144" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📊 Spatial Analytics</text>
      </g>

      <!-- Tag 3 -->
      <g transform="translate(300, 0)">
        <rect width="154" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📍 Mobility &amp; Footfall</text>
      </g>

      <!-- Tag 4 -->
      <g transform="translate(464, 0)">
        <rect width="138" height="32" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Open Geospatial</text>
      </g>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect width="1200" height="380" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" rx="16" />
</svg>
